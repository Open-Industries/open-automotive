openapi: 3.1.0
info:
  title: Open Automotive — Reference Automotive Core Platform — aggregate contract
  version: 1.0.0
  description: >
    Aggregate view of the platform's public REST contracts. The normative per-service
    contracts are generated from code by Quarkus SmallRye OpenAPI at `/openapi` on each
    service; CI diffs them against this file (see docs/api/api-standards.md).
    Conventions: RFC 9457 errors, Idempotency-Key on creates, lifecycle transitions
    take no body, explicit units on every quantity, all data synthetic.
servers:
  - url: https://api.example.org/api/v1
    description: Production (per adopter)
security:
  - bearerAuth: []
paths:
  /vehicles:
    post:
      operationId: create-vehicle
      summary: "Vehicle registry; the VIN is masked at registration and never kept in clear."
      responses:
        '201': { description: Created }
        '400': { $ref: '#/components/responses/Problem' }
  /parts-inventory:
    post:
      operationId: create-parts
      summary: "Guarded parts availability per plant and the withdrawals against it."
      responses:
        '201': { description: Created }
        '400': { $ref: '#/components/responses/Problem' }
  /safety-rules:
    post:
      operationId: create-safety
      summary: "Per-system-area safety envelopes (coverage, defect rate) with reasoned decisions."
      responses:
        '201': { description: Created }
        '400': { $ref: '#/components/responses/Problem' }
  /models:
    post:
      operationId: create-model
      summary: "Vehicle model catalogue: segments and capacities."
      responses:
        '201': { description: Created }
        '400': { $ref: '#/components/responses/Problem' }
  /notifications:
    post:
      operationId: dispatch-notification
      summary: Dispatch a notification
      responses:
        '202': { description: Accepted }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema:
            type: object
            required: [type, title, status]
            properties:
              type: { type: string }
              title: { type: string }
              status: { type: integer }
              detail: { type: string }
